apply plugin: "com.android.application"
apply plugin: 'kotlin-android'

import com.android.build.OutputFile

project.ext.react = [
    entryFile: "index.js",
    enableHermes: false,
]

apply from: "../../node_modules/react-native/react.gradle"

def enableSeparateBuildPerCPUArchitecture = true

def proguardFiles = [
    getDefaultProguardFile("proguard-android.txt"),
    "proguard-rules.pro",
]

android {
    namespace "com.ducodolaralert"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.ducodolaralert"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            enableProguard false
            proguardFiles proguardFiles
        }
        release {
            signingConfig signingConfigs.debug
            enableProguard true
            proguardFiles proguardFiles
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
        pickFirst "lib/x86/libc++_shared.so"
    }
}

dependencies {
    implementation "com.android.support:appcompat-v7:${rootProject.ext.targetSdkVersion}"
    implementation "com.facebook.react:react-native"
    implementation project("@react-native-async-storage_async-storage")
    implementation project(":react-native-background-fetch")
    implementation project(":react-native-push-notification")
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0"
    implementation "com.google.android.gms:play-services-basement:18.1.0"
}
