buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 21
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "21.4.7075529"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            // Android RN directory is inside node_modules/react-native/android
            url("$rootDir/../node_modules/react-native/android")
        }
        google()
        maven { url 'https://www.jitpack.io' }
    }
}
